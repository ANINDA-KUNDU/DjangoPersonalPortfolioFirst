services:
  - type: web
    plan: free
    name: anindakundu
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn portfolio.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aninda-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: MEDIA_ROOT
        value: "/data/media"
      - key: SERVE_MEDIA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: "CLOUDINARY_CLOUD_NAME"
        value: "false"
      - key: "CLOUDINARY_API_KEY"
        value: "false"
      - key : "CLODINARY_SECRET_KEY"
        value: "false"