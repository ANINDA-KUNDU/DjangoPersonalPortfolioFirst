databases:
  - name: portfolio-db
    plan: free

services:
  - type: web
    plan: free
    name: aninda
    slug: aninda
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn portfolio.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4