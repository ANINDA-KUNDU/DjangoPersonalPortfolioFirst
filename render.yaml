databases:
  - name: anindadb
    plan: free
services:
  - type: web
    plan: free
    name: anindakundu
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'gunicorn portfolio.wsgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anindadb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: MEDIA_ROOT
        value: "/data/media"
      - key: SERVE_MEDIA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "4"
