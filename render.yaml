databases:
  - name: anindadb
    plan: free
    databaseName: anindadb
    user: aninda

services:
  - type: web
    plan: free
    name: anindakundu
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn portfolio.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anindadb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4