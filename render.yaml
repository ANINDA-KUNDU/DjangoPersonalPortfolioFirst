services:
  - type: web
    plan: free
    name: anindakundu
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn portfolio.asgi:application -k uvicorn.workers.UvicornWorker'
    disk:
    name: media-storage
    mountPath: /data/media
    sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aninda-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: MEDIA_ROOT
        value: "/data/media"
      - key: SERVE_MEDIA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "4"